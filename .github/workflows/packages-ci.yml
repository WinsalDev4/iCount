name: contracts-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contracts-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -w @icount/contracts
      - run: npm run typecheck -w @icount/contracts
      - run: npm run format:check -w @icount/contracts
      - run: npm test -w @icount/contracts

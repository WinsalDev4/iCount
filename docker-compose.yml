# Infraestructura local de desarrollo: `docker compose up -d` (todo) o `npm run db:up` (solo PostgreSQL).
name: icount

services:
  postgres:
    image: postgres:17-alpine
    container_name: icount-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-icount}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icount}
      POSTGRES_DB: ${POSTGRES_DB:-icount}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Email de desarrollo (ADR-0013): la API envía por SMTP a localhost:1025 y los correos
  # (enlaces mágicos) se leen en http://localhost:8025. Nunca sale nada a Internet.
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: icount-mailpit
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:

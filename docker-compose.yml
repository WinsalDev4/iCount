# Infraestructura local de desarrollo. Uso: `npm run db:up` (o `docker compose up -d`).
name: icount

services:
  postgres:
    image: postgres:17-alpine
    container_name: icount-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-icount}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icount}
      POSTGRES_DB: ${POSTGRES_DB:-icount}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
